name: Smokeshow

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  statuses: write

jobs:
  smokeshow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: astral-sh/setup-uv@v7

      - run: uv tool install smokeshow

      - name: Download coverage artifact
        uses: dawidd6/action-download-artifact@v17
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          commit: ${{ github.event.workflow_run.head_sha }}
          name: coverage-html
          path: coverage-html

      # Smokeshow refuses a site over 50 MiB, and the full report is larger.
      # Keep the index, assets and status.json, then the file pages of the
      # least covered files first, up to 45 MB; the full report stays the
      # coverage-html artifact of the CI run.
      - name: Fit the coverage site within smokeshow's size limit
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path

          site, budget = Path("coverage-html"), 45_000_000
          files = json.loads((site / "status.json").read_text())["files"]

          def covered(entry):
              nums = entry["index"]["nums"]
              total = nums["n_statements"] + nums["n_branches"]
              done = total - nums["n_missing"] - nums["n_missing_branches"]
              return done / total if total else 1.0

          pages = {site / item["index"]["url"]: covered(item) for item in files.values()}
          pages = {path: share for path, share in pages.items() if path.is_file()}
          used = sum(
              p.stat().st_size for p in site.rglob("*") if p.is_file() and p not in pages
          )
          kept = dropped = 0
          for path, _ in sorted(pages.items(), key=lambda item: (item[1], item[0].name)):
              size = path.stat().st_size
              if used + size <= budget:
                  used += size
                  kept += 1
              else:
                  path.unlink()
                  dropped += 1
          print(
              f"coverage site: {used / 1e6:.1f} MB, {kept} file pages kept "
              f"(least covered first), {dropped} left out"
          )

      - run: smokeshow upload coverage-html/
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 80 # increase to 100
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
