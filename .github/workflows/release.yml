name: Release

# PyPI releases come only from main: after CI succeeds on a push to main, a
# version bump in pyproject.toml creates the tag, publishes to PyPI and
# publishes the release notes. Commits without a version bump publish nothing.
# Pull requests publish pre-releases to TestPyPI from ci.yml.
# Publishing uses PyPI trusted publishing (OIDC) through the `pypi` environment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check-version:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6

      - name: Detect and tag new version
        id: check-version
        uses: salsify/action-detect-and-tag-new-version@v2.0.3
        with:
          version-command: uv version --short

  publish-pypi:
    needs: check-version
    if: needs.check-version.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always

  release-notes:
    needs: [check-version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          publish: true
          tag: ${{ needs.check-version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
