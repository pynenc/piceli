name: Release

# Runs only after CI succeeded on main. A version bump in pyproject.toml creates
# the tag and publishes to PyPI; any other commit publishes a dev build to TestPyPI.
# Publishing uses PyPI trusted publishing (OIDC): configure the `pypi` and
# `testpypi` environments and the trusted publisher on (Test)PyPI; no API tokens.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6

      - name: Detect and tag new version
        id: check-version
        uses: salsify/action-detect-and-tag-new-version@v2.0.3
        with:
          version-command: uv version --short

      - name: Use a unique dev version for TestPyPI
        if: steps.check-version.outputs.tag == ''
        run: |
          base=$(uv version --short)
          uv version --no-sync "${base}.dev$(date +%s)"

      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always

  publish-testpypi:
    needs: build
    if: needs.build.outputs.tag == ''
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  release-notes:
    needs: [build, publish-pypi]
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          publish: true
          tag: ${{ needs.build.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
