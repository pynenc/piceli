name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --python 3.12
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - name: Unit and acceptance tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Store coverage data
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-unit
          path: .coverage
          include-hidden-files: true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.33.1
          cluster_name: piceli-ci
      - run: uv sync --all-extras --python 3.12
      - name: Integration tests
        run: uv run pytest tests/integration --cov --cov-report=term
      - name: Store coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-integration
          path: .coverage
          include-hidden-files: true

  package:
    # The wheel must work without optional extras (gcp, telemetry).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Smoke-test a core-only install
        run: |
          uv venv --python 3.12 /tmp/core
          uv pip install --python /tmp/core/bin/python dist/*.whl
          /tmp/core/bin/python -c "import importlib.util as u; assert u.find_spec('google') is None"
          /tmp/core/bin/piceli --help
          /tmp/core/bin/piceli artifacts --help
          /tmp/core/bin/piceli artifacts build-spec --help
          /tmp/core/bin/piceli artifacts deliver --help
          /tmp/core/bin/piceli release --help
          /tmp/core/bin/piceli inputs --help
          /tmp/core/bin/piceli observe forwards --help
          /tmp/core/bin/piceli render --help
          /tmp/core/bin/piceli render --spec examples/typed_app/release.toml > /tmp/render.yaml
          grep -q "kind: Deployment" /tmp/render.yaml
          /tmp/core/bin/piceli render --spec examples/typed_app/release.toml --format json | /tmp/core/bin/python -c "import json, sys; assert json.load(sys.stdin)"

  build-spec-arm64:
    # Real containerized build of examples/builds/rust-hello on a native arm64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: docker buildx version
      - run: uv sync --python 3.12
      - run: uv run python -m piceli artifacts build-spec preview --spec examples/builds/rust-hello/build.toml
      - run: uv run pytest -q tests/unit/test_build_spec.py -k rust_hello --timeout=1800
        env:
          PICELI_DOCKER_TESTS: "1"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --group docs --python 3.12
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  publish-testpypi:
    # Every pull request from this repository publishes a pre-release to TestPyPI
    # once the checks pass (PyPI releases come only from main, see release.yml).
    # Fork PRs cannot use trusted publishing, so they are skipped.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    needs: [lint, test, package, docs]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Set the PR pre-release version
        # PEP 440: {version}rc{pr}.dev{run}, e.g. 0.0.5rc12.dev3
        run: |
          version="$(uv version --short)rc${PR_NUMBER}.dev${GITHUB_RUN_NUMBER}"
          uv version "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: uv build
      - name: Publish to TestPyPI
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
      - name: Comment the install command on the PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `📦 \`piceli ${process.env.VERSION}\` published to TestPyPI:`,
                "```bash",
                `pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "piceli==${process.env.VERSION}"`,
                "```",
              ].join("\n"),
            });

  coverage:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --python 3.12
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-*
      - run: |
          uv run coverage combine coverage-data-unit/.coverage coverage-data-integration/.coverage
          uv run coverage report
          uv run coverage html --show-contexts --title "Combined coverage"
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: htmlcov
