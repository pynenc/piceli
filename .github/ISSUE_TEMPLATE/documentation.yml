name: "Documentation"
description: Something in the docs is wrong, missing or unclear
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or file under docs/.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
