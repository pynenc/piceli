name: "Feature request"
description: Propose a new capability or an improvement
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to deploy or operate, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would it look in the typed model or on the command line?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today (YAML, kubectl, Helm, a script) and what else you considered.
