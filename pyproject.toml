[project]
name = "piceli"
version = "0.4.1"
description = "Kubernetes infrastructure as typed Python: model, plan, apply and observe"
authors = [{ name = "Jose Diaz" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["kubernetes", "infrastructure-as-code", "deployment", "gitops", "devops"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "kubernetes>=29.0.0",
    "pydantic>=2.6",
    "pyyaml>=6.0.1",
    "typer>=0.12",
    "rich>=13.7",
    "cron-validator>=1.0.8",
]

[project.optional-dependencies]
gcp = [
    "google-auth>=2.27",
    "google-api-core>=2.17",
    "google-cloud-container>=2.40",
    "tenacity>=8.2.3",
]
telemetry = [
    "opentelemetry-api>=1.41.1",
    "opentelemetry-proto>=1.27.0",
]

[project.urls]
Homepage = "https://pynenc.org"
Documentation = "https://docs.pynenc.org/projects/piceli/"
Repository = "https://github.com/pynenc/piceli"
Changelog = "https://docs.pynenc.org/projects/piceli/en/latest/changelog.html"
Issues = "https://github.com/pynenc/piceli/issues"

[project.scripts]
piceli = "piceli.__main__:main"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "jsonschema>=4.23",
]
lint = [
    "ruff>=0.14",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.0",
]
docs = [
    "sphinx>=8.0,<10",
    "myst-parser>=4.0",
    "furo>=2024",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
    "sphinx-inline-tabs>=2023.4.21",
    "sphinx-autodoc2>=0.5.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piceli"]

[tool.hatch.build.targets.sdist]
exclude = ["/target", "/docs/apidocs", "/.github"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "C901",   # complexity is reviewed by humans, not gated
    # Style-only simplifications: not worth churning working code for.
    "SIM102", "SIM105", "SIM117", "RUF005", "RUF015", "RUF059",
    "RUF012", # pydantic/dataclass class attributes are intentional
    "UP047",  # PEP 695 generics: adopt gradually
]

[tool.mypy]
files = ["piceli"]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
pretty = true
allow_redefinition = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/acceptance"]
log_cli = true
timeout = 30
markers = [
    "integration: needs a real disposable cluster (kind) via kubeconfig",
    "maintainer: needs the private companion workspace; skipped by default",
]
filterwarnings = [
    "ignore:Running in a secondary thread. Signal handling will be skipped.:UserWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["piceli"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if (typing\\.)?TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
]
