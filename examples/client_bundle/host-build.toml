# The example's image, built on the host for both platforms: BusyBox (sh,
# wget, httpd) and the script in src/. No compiler, no container VM.
#
#   piceli artifacts build-spec run --spec host-build.toml --out receipt.json
revision = "piceli.host-build.v1"
name = "client-bundle-web"

[build]
tools = ["sh"]
platforms = ["linux/amd64", "linux/arm64"]
commands = [
    ["sh", "-c", "mkdir -p \"$CARGO_TARGET_DIR/{rust_arch}/release\" && cp web/web.sh \"$CARGO_TARGET_DIR/{rust_arch}/release/web\" && chmod 755 \"$CARGO_TARGET_DIR/{rust_arch}/release/web\""],
]

[context.web]
path = "src"
include = ["web.sh"]

[[output.image]]
name = "web"
repository = "example/web"
base = { image = "docker.io/library/busybox", digest = "sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092" }
target_files = { "{rust_arch}/release/web" = "/usr/local/bin/web" }
user = "10001:10001"
entrypoint = ["/usr/local/bin/web"]
