# Deploy on push with Piceli: plan the pushed commit, wait for a reviewer,
# then apply exactly the plan they approved.
#
# Copy this file to .github/workflows/deploy.yml in your repository and adapt
# the `env` block and the runner labels. The guide is docs/ci.md
# (https://docs.pynenc.org/projects/piceli/en/latest/ci.html).
#
# Piceli's own tests run the `piceli deploy` command lines of this file, in
# this order, against a fake cluster (tests/acceptance/test_ci_recipe.py), so
# the recipe cannot drift from the CLI.
#
# Needs, once per repository:
# - a self-hosted runner that reaches the cluster API and has Docker, labelled
#   `deploy-my-app` (plan and apply share its build cache and state directory);
# - a repository secret DEPLOY_KUBECONFIG holding a kubeconfig with the one
#   context the pipeline declares (Target.kubeconfig(..., context=...));
# - an environment `production` with required reviewers.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume:
        description: Continue the latest interrupted deploy run (same commits)
        type: boolean
        default: false

# One deploy of this target at a time; never cancel a deploy that is applying.
concurrency:
  group: deploy-my-app
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The pipeline, relative to the repository root.
  PIPELINE: deploy/app.py:pipeline
  # Read by deploy/app.py: Pipeline(state_dir=os.environ["DEPLOY_STATE_DIR"]).
  # Keep it on the runner, outside the checkout: it holds the run journal,
  # the release catalog and the secret store.
  DEPLOY_STATE_DIR: /var/lib/piceli/my-app

jobs:
  plan:
    if: ${{ !inputs.resume }}
    runs-on: [self-hosted, deploy-my-app]
    outputs:
      combined_hash: ${{ steps.plan.outputs.combined_hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Write the kubeconfig (mode 0600, never printed)
        env:
          KUBECONFIG_CONTENT: ${{ secrets.DEPLOY_KUBECONFIG }}
        run: |
          umask 077
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/deploy.kubeconfig"
          echo "DEPLOY_KUBECONFIG=$RUNNER_TEMP/deploy.kubeconfig" >> "$GITHUB_ENV"
      - name: Plan the pushed commit
        id: plan
        run: |
          uv run --frozen piceli deploy "$PIPELINE" --ref "$GITHUB_SHA" --plan --json > plan.jsonl 2> plan.txt || { cat plan.txt >&2; exit 1; }
          jq -c 'select(.event == "result")' plan.jsonl > plan.json
          echo "combined_hash=$(jq -r .combined_hash plan.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy plan for \`$GITHUB_SHA\`"
            echo
            echo "Combined hash: \`$(jq -r .combined_hash plan.json)\`"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: deploy-plan
          path: |
            plan.json
            plan.txt
      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.kubeconfig"

  apply:
    needs: plan
    runs-on: [self-hosted, deploy-my-app]
    # Required reviewers approve this environment after reading the plan in
    # the plan job's summary; the job then applies exactly that plan.
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Write the kubeconfig (mode 0600, never printed)
        env:
          KUBECONFIG_CONTENT: ${{ secrets.DEPLOY_KUBECONFIG }}
        run: |
          umask 077
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/deploy.kubeconfig"
          echo "DEPLOY_KUBECONFIG=$RUNNER_TEMP/deploy.kubeconfig" >> "$GITHUB_ENV"
      - name: Apply the approved plan
        env:
          COMBINED_HASH: ${{ needs.plan.outputs.combined_hash }}
        run: |
          uv run --frozen piceli deploy "$PIPELINE" --ref "$GITHUB_SHA" --approve "$COMBINED_HASH" --json > apply.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deploy-result
          path: apply.jsonl
      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.kubeconfig"

  resume:
    if: ${{ inputs.resume }}
    runs-on: [self-hosted, deploy-my-app]
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Write the kubeconfig (mode 0600, never printed)
        env:
          KUBECONFIG_CONTENT: ${{ secrets.DEPLOY_KUBECONFIG }}
        run: |
          umask 077
          printf '%s\n' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/deploy.kubeconfig"
          echo "DEPLOY_KUBECONFIG=$RUNNER_TEMP/deploy.kubeconfig" >> "$GITHUB_ENV"
      - name: Resume the interrupted run at its failed stage
        run: |
          uv run --frozen piceli deploy "$PIPELINE" --resume --json > resume.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deploy-resume
          path: resume.jsonl
      - name: Remove the kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy.kubeconfig"
