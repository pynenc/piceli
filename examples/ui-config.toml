# Example Piceli dashboard configuration and access profile.
#
# Use with:
#   piceli observe serve  --ui-config examples/ui-config.toml ...
#   piceli operator serve --ui-config examples/ui-config.toml ...
# or export PICELI__UI_CONFIG=/path/to/ui-config.toml
#
# The same file is an access profile: start and health-supervise every
# shortcut in the foreground with
#   piceli observe forwards apply --profile examples/ui-config.toml \
#     --kubeconfig ~/.kube/config --context my-cluster --namespace my-app
#   piceli observe forwards status --profile examples/ui-config.toml
#
# Shortcut namespaces are left unset so they follow the served namespace
# (--namespace). Pin one with `namespace = "..."`.

topology_subtitle = "My App: web front end, API and background workers"

[[badges]]
label = "Web"
text = "demo / demo"

# ---------------------------------------------------------------- shortcuts --

[[shortcuts]]
id = "web"
label = "Web UI"
description = "Browser front end"
target = "service/my-app-web"
local_port = 3000
remote_port = 8080
path = "/login"
health_path = "/"
# Not required: `forwards apply` skips it (instead of refusing to start) when
# another process already serves local port 3000.
required = false

[[shortcuts]]
id = "api"
label = "HTTP API"
description = "Public REST API"
target = "service/my-app-api"
local_port = 18080
remote_port = 8000
path = "/docs"

  # Optional connection health probe. Without it a shortcut gets a TCP probe
  # (or, with `health_path = "/x"`, an HTTP probe accepting any status < 500).
  [shortcuts.health]
  type = "http"               # "tcp" or "http"
  path = "/healthz"
  expect_status = [200, 399]  # inclusive range
  interval = 5.0              # seconds between probes
  timeout = 2.0
  failure_threshold = 3       # consecutive failures before a restart
  startup_grace = 3.0         # failures right after a (re)start don't count

  # Optional bounded restart policy (these are the defaults).
  [shortcuts.restart]
  backoff_initial = 1.0
  backoff_max = 30.0
  max_restarts = 10           # consecutive restarts without a healthy probe

# -------------------------------------------------------------------- tiers --

[[tiers]]
id = "app"
name = "Application Tier"
badge = "Web & API"

  [[tiers.components]]
  name = "my-app-web"
  role = "Web front end"
  description = "Server-rendered user interface."
  ports = "8080"
  shortcut = "web"

  [[tiers.components]]
  name = "my-app-api"
  role = "REST API"
  description = "Stateless HTTP API in front of the datastore and task queue."
  ports = "8000"
  shortcut = "api"

[[tiers]]
id = "data"
name = "Data & Task Tier"
badge = "Storage & Workers"

  [[tiers.components]]
  name = "my-app-postgres"
  role = "Primary datastore"
  description = "PostgreSQL with a persistent volume."
  ports = "5432"

  [[tiers.components]]
  name = "my-app-worker"
  role = "Task worker"
  description = "Background workers consuming the task queue."
  ports = "Internal"

# ---------------------------------------------------------------- inventory --
# Live objects carrying these labels count as managed by this application;
# their release name is read from the revision label.

[inventory]
managed_labels = { "app.kubernetes.io/part-of" = "my-app" }
revision_label = "my-app/revision"
