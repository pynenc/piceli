apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: webapp
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: webapp
    spec:
      {{- include "webapp.podSecurity" . | nindent 6 }}
      containers:
        - name: api
          {{- include "webapp.server" . | nindent 10 }}
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: settings
                  key: LOG_LEVEL
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: site
          configMap:
            name: site
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: webapp
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
