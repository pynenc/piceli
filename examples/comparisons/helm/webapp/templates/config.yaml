apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: webapp
data:
  {{- toYaml .Values.settings | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: site
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: webapp
data:
  index.html: |
    <h1>webapp</h1>
  healthz: |
    ok
