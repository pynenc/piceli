# Defaults shared by every environment; values-<env>.yaml overrides them.
image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

settings:
  LOG_LEVEL: info
  FEATURE_REPORTS: "on"

api:
  replicas: 1
  resources:
    requests: {cpu: 20m, memory: 16Mi}
    limits: {memory: 32Mi}

web:
  resources:
    requests: {cpu: 20m, memory: 16Mi}
    limits: {memory: 32Mi}
  autoscaling:
    minReplicas: 2
    maxReplicas: 6
    cpu: 70
