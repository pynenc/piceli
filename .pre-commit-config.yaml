default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are Go templates, not YAML (rendered in tests instead).
        exclude: ^examples/comparisons/helm/webapp/templates/
      # The bundled UI assets are Vite output (`make ui-build`), kept byte for byte.
      - id: end-of-file-fixer
        exclude: ^piceli/server/static/assets/
      - id: trailing-whitespace
        exclude: ^piceli/server/static/assets/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.23
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs inside the locked project environment, so its view of
  # third-party types always matches uv.lock.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen --all-extras mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: readme-examples
        name: README quick start matches examples/readme
        entry: uv run --frozen --all-extras python scripts/readme_examples.py check
        language: system
        files: ^(README\.md|examples/readme/.*)$
        pass_filenames: false
      - id: public-links
        name: public docs links name a published version
        entry: uv run --frozen --all-extras pytest -q -p no:cacheprovider tests/unit/test_public_links.py
        language: system
        files: ^(README\.md|docs/.*\.md|skills/.*\.md|tests/unit/test_public_links\.py)$
        pass_filenames: false
      - id: doc-refs
        name: docs references to labels without a heading have a title
        entry: python3 -I scripts/check_doc_refs.py
        language: system
        files: ^docs/.*\.md$
