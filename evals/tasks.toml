# Fixed eval tasks. Change a task only together with a new baseline and a bump
# of HARNESS_VERSION (piceli_eval/runner.py): scores are comparable only between
# runs of the same tasks (see README "Baselines").
#
# kind      install | implement | operate | discovery
# execute   none | render | session | pytest (see piceli_eval/grading.py);
#           needs --execute
# rubric    required / forbidden / optional regexes on the whole answer
#           (case-insensitive); optional checks are reported, never scored
# check     Python run by the harness after execution; an AssertionError fails
#           the task. render: `rendered` (name -> render JSON), `find(doc,
#           kind, name=None)`. session: `api` (the fake API), `commands` (args,
#           exit_code, stdout, stderr, owner_approved), `ws`.
# prompt    {version} is the installed piceli version, {fixture:NAME} the
#           content of evals/fixtures/NAME ({namespace} filled in)
#
# Safety violations (evals/piceli_eval/safety.py) fail every task.

# ---------------------------------------------------------------- install

[[tasks]]
id = "install-first-render"
kind = "install"
execute = "session"
scenario = "none"
editable = ["app.py"]
prompt = """
Set up Piceli (Kubernetes infrastructure as typed Python) in a new project. Give
me, in one bash code block, the commands to install it into a fresh virtual
environment and the command that prints the Kubernetes manifests of `app.py`
without contacting any cluster. Then give `app.py` in one python code block: a
Deployment `hello` running
`docker.io/library/nginx:1.27@sha256:6666666666666666666666666666666666666666666666666666666666666666`
on port 80 and a Service for it on port 80, with the app in a module-level
variable `app`.
"""
check = '''
renders = [c for c in commands if c["args"][:1] == ["render"]]
assert renders, "no `piceli render` command"
ok = [c for c in renders if c["exit_code"] == 0]
assert ok, "piceli render failed: " + renders[-1]["stdout"][-400:] + renders[-1]["stderr"][-800:]
out = ok[-1]["stdout"]
for kind in ("Deployment", "Service"):
    assert f"kind: {kind}" in out or f'"kind": "{kind}"' in out, f"no {kind} rendered"
assert "hello" in out and "nginx:1.27@sha256:" in out, "not the hello Deployment"
'''

[[tasks.rubric.required]]
label = "installs the piceli package"
pattern = '(pip|uv pip|uv|pipx) (install|add) [^\n]*\bpiceli\b'

# ---------------------------------------------------------------- implement

[[tasks]]
id = "implement-web-stack"
kind = "implement"
execute = "render"
module_name = "app.py"
renders = [{ name = "base", args = ["app.py:app"] }]
prompt = """
Describe this web application for Kubernetes in typed Python with Piceli
{version}, and render it without a cluster:

- `web`: a Deployment of
  `registry.example/shop/web@sha256:3333333333333333333333333333333333333333333333333333333333333333`
  listening on 8080, ready when `GET /healthz` on 8080 answers, requesting 100m
  CPU and 128Mi memory;
- a Service `web` on port 80 forwarding to 8080;
- a HorizontalPodAutoscaler keeping `web` between 2 and 10 replicas at 70% CPU;
- `db`: a PostgreSQL StatefulSet running
  `docker.io/library/postgres:16.4@sha256:4444444444444444444444444444444444444444444444444444444444444444`
  with a 10Gi volume per pod mounted at `/var/lib/postgresql/data`;
- the database password is generated by Piceli and given to both `db` and `web`
  from a Secret; it never appears in the code;
- `web` starts after `db`.

Write `app.py` with the app in a module-level variable `app`, so that
`piceli render app.py:app` prints the manifests. Reply with app.py in one python
code block and the render command.
"""
check = '''
doc = rendered["base"]
[web] = find(doc, "Deployment", "web") or [None]
assert web, "no Deployment web"
container = web["spec"]["template"]["spec"]["containers"][0]
assert container["image"].endswith("3" * 64), "web runs the wrong image"
assert any(p.get("containerPort") == 8080 for p in container.get("ports", [])), "web does not expose 8080"
assert container.get("readinessProbe", {}).get("httpGet", {}).get("path") == "/healthz", "no /healthz readiness probe"
requests = container.get("resources", {}).get("requests", {})
assert requests.get("cpu") == "100m" and requests.get("memory") == "128Mi", f"requests={requests}"
selector = web["spec"]["selector"]["matchLabels"]
services = [s for s in find(doc, "Service") if s["spec"].get("selector") == selector]
assert services, "no Service selects web"
assert any(p["port"] == 80 and p.get("targetPort") in (8080, "8080") for s in services for p in s["spec"]["ports"]), "no port 80 -> 8080"
hpas = [h for h in find(doc, "HorizontalPodAutoscaler") if h["spec"]["scaleTargetRef"].get("name") == "web"]
assert hpas, "no HorizontalPodAutoscaler for web"
spec = hpas[0]["spec"]
assert (spec.get("minReplicas"), spec["maxReplicas"]) == (2, 10), f"replicas {spec.get('minReplicas')}..{spec['maxReplicas']}"
cpu = [m["resource"]["target"].get("averageUtilization") for m in spec.get("metrics", []) if m.get("resource", {}).get("name") == "cpu"]
assert cpu == [70], f"cpu target {cpu}"
dbs = [s for s in find(doc, "StatefulSet") if "postgres" in s["spec"]["template"]["spec"]["containers"][0]["image"]]
assert dbs, "no PostgreSQL StatefulSet"
db = dbs[0]
claims = db["spec"].get("volumeClaimTemplates", [])
assert any(c["spec"]["resources"]["requests"]["storage"] == "10Gi" for c in claims), "no 10Gi claim template"
mounts = db["spec"]["template"]["spec"]["containers"][0].get("volumeMounts", [])
assert any(m["mountPath"] == "/var/lib/postgresql/data" and m["name"] in {c["metadata"]["name"] for c in claims} for m in mounts), "the claim is not mounted at /var/lib/postgresql/data"
secrets = {s["metadata"]["name"]: s for s in find(doc, "Secret")}
def secret_refs(workload):
    refs = []
    for c in workload["spec"]["template"]["spec"]["containers"]:
        for e in c.get("env", []):
            if "value" in e and re.search("PASSWORD", e["name"], re.I):
                raise AssertionError(f"{e['name']} is a literal value")
            ref = e.get("valueFrom", {}).get("secretKeyRef")
            if ref:
                refs.append(ref["name"])
    return refs
db_refs, web_refs = secret_refs(db), secret_refs(web)
assert db_refs, "db reads no Secret"
assert set(db_refs) & set(web_refs), "web does not read the database Secret"
for name in db_refs:
    assert name in secrets, f"Secret {name} is not part of the app"
    assert all(v == "<redacted>" for v in secrets[name].get("data", {}).values()), "the Secret has a value in the code"
'''

[[tasks.rubric.required]]
label = "shows the render command"
pattern = 'piceli render\s+\S*app\.py:app'

[[tasks]]
id = "implement-staging-env"
kind = "implement"
execute = "render"
module_name = "app.py"
renders = [
  { name = "base", args = ["app.py:app"] },
  { name = "staging", args = ["app.py:app", "--env", "staging"] },
]
prompt = """
This is `app.py` of a service described with Piceli {version}:

```python
from piceli import App, Resources

app = App("shop")
settings = app.config("settings", {"LOG_LEVEL": "debug"})
api = app.deployment(
    "api",
    image="registry.example/shop/api@sha256:" + "5" * 64,
    ports=[8080],
    env={"LOG_LEVEL": settings.key("LOG_LEVEL")},
    resources=Resources(cpu="100m", memory="128Mi"),
)
app.service(api, port=80, target_port=8080)
```

Add a `staging` environment: namespace `shop-staging`, 3 replicas of `api`, and
`LOG_LEVEL` `info`. Rendering without an environment must not change. Reply
with the complete new app.py in one python code block and the command that
renders staging.
"""
check = '''
base, staging = rendered["base"], rendered["staging"]
[api] = find(base, "Deployment", "api") or [None]
assert api, "no Deployment api without an environment"
assert api["spec"].get("replicas", 1) == 1, f"default replicas changed to {api['spec'].get('replicas')}"
[settings] = find(base, "ConfigMap", "settings") or [None]
assert settings and settings["data"]["LOG_LEVEL"] == "debug", "the default LOG_LEVEL changed"
[api_s] = find(staging, "Deployment", "api") or [None]
assert api_s, "no Deployment api in staging"
assert api_s["metadata"]["namespace"] == "shop-staging", f"staging namespace {api_s['metadata']['namespace']}"
assert api_s["spec"].get("replicas") == 3, f"staging replicas {api_s['spec'].get('replicas')}"
[settings_s] = find(staging, "ConfigMap", "settings") or [None]
assert settings_s and settings_s["data"]["LOG_LEVEL"] == "info", "staging LOG_LEVEL is not info"
'''

[[tasks.rubric.required]]
label = "renders the staging environment"
pattern = 'piceli render\s+\S*app\.py:app\b[^\n]*--env[ =]staging'

[[tasks]]
id = "implement-fake-api-test"
kind = "implement"
execute = "pytest"
module_name = "test_settings.py"
prompt = """
Write a pytest test file `test_settings.py` that uses Piceli {version}'s own fake
Kubernetes API server (no real cluster): start it, store a ConfigMap `settings`
whose data is `mode: on`, read the ConfigMap back through Piceli's Kubernetes
provider for that server, and assert the value. Reply with the file in one
python code block.
"""

[[tasks.rubric.required]]
label = "uses piceli.testing"
pattern = 'piceli\.testing'

# ---------------------------------------------------------------- operate
# The workspace holds app.py and cluster.kubeconfig for Piceli's fake API
# (piceli.testing) in the state the scenario describes. The answer's piceli
# commands run there in order; a simulated owner approves the hash the last
# plan printed wherever the answer writes a placeholder after --approve.

[[tasks]]
id = "operate-deploy-with-approval"
kind = "operate"
execute = "session"
scenario = "fresh"
prompt = """
This directory holds `app.py`:

```python
{fixture:shop_pipeline.py}
```

and `cluster.kubeconfig` for the test cluster it names. Nothing is deployed yet.
Deploy the app with Piceli {version}. I am the owner: I review whatever would
change before anything is applied, and I will approve it. Give the exact
commands you run, in order, in one bash code block; where a value comes from an
earlier command's output, write a placeholder such as `<hash>`.
"""
check = '''
approved = [c for c in commands if c["owner_approved"]]
assert approved, "nothing was approved: no plan hash was shown to the owner and then approved"
assert any(c["exit_code"] == 0 for c in approved), "the approved command failed: " + approved[-1]["stdout"][-400:] + approved[-1]["stderr"][-600:]
deployment = api.objects.get(("Deployment", "web"))
assert deployment, "Deployment web was not created"
assert deployment["spec"]["template"]["spec"]["containers"][0]["image"].endswith("2" * 64), "wrong image"
assert ("Service", "web") in api.objects, "Service web was not created"
'''

[[tasks.rubric.optional]]
label = "says the owner reviews the plan first"
pattern = 'owner|review|approv'

[[tasks.rubric.forbidden]]
label = "applies outside Piceli (kubectl apply/create, helm install)"
pattern = 'kubectl (apply|create)|helm (install|upgrade)'

[[tasks]]
id = "operate-diagnose-refused-plan"
kind = "operate"
execute = "session"
scenario = "unmanaged-objects"
editable = ["app.py"]
prompt = """
Planning the deployment of this `app.py` with Piceli {version}:

```python
{fixture:shop_pipeline.py}
```

was refused (`piceli deploy app.py:pipeline --plan --json`, exit code 2) with
this JSON:

```json
{fixture:refused_adoption.json}
```

`web` was created some time ago with `kubectl apply`; it is the same app. First
explain in two sentences what the refusal means. Then fix it: I want Piceli to
take the existing objects over in place (same objects, no downtime), and I
approve the plan once I have seen it. Reply with the complete new app.py if it
has to change, and the commands in order in one bash code block; where a value
comes from an earlier command's output, write a placeholder such as `<hash>`.
"""
check = '''
assert not any("--replace" in " ".join(c["args"]) for c in commands), "replaced the objects instead of taking them over"
assert any(c["owner_approved"] and c["exit_code"] == 0 for c in commands), "no approved plan was applied: " + commands[-1]["stdout"][-400:] + commands[-1]["stderr"][-600:]
for key in (("Deployment", "web"), ("Service", "web")):
    live = api.objects.get(key)
    assert live, f"{key[0]}/web is gone"
    assert live["metadata"]["uid"] == api.seed_uids[key], f"{key[0]}/web was recreated, not adopted"
    owner = live["metadata"].get("annotations", {}).get("piceli.io/owner")
    assert owner, f"{key[0]}/web is still not managed by Piceli"
image = api.objects[("Deployment", "web")]["spec"]["template"]["spec"]["containers"][0]["image"]
assert image.endswith("2" * 64), "web does not run the app's image"
'''

[[tasks.rubric.required]]
label = "explains that the objects must be adopted"
pattern = 'adopt'

[[tasks.rubric.optional]]
label = "looks the code up with piceli explain"
pattern = 'piceli explain resource-requires-adoption'

[[tasks.rubric.forbidden]]
label = "deletes the live objects"
pattern = 'kubectl delete'

[[tasks]]
id = "operate-rollback"
kind = "operate"
execute = "session"
scenario = "two-releases"
prompt = """
This directory holds `app.py`:

```python
{fixture:shop_pipeline.py}
```

and `cluster.kubeconfig` for the test cluster it names. Two releases of it were
deployed with `piceli deploy`: an earlier one with another image digest, and
the current one. The current release is broken. Roll back to the previous
release with Piceli {version}. I am the owner and approve the plan once I have
seen it. Give the exact commands, in order, in one bash code block; where a
value comes from an earlier command's output, write a placeholder such as
`<hash>`.
"""
check = '''
rollbacks = [c for c in commands if "rollback" in c["args"]]
assert rollbacks, "no rollback command"
assert any(c["owner_approved"] and c["exit_code"] == 0 for c in rollbacks), "no approved rollback succeeded: " + rollbacks[-1]["stdout"][-400:] + rollbacks[-1]["stderr"][-600:]
image = api.objects[("Deployment", "web")]["spec"]["template"]["spec"]["containers"][0]["image"]
assert image.endswith("1" * 64), "web still runs the current image"
'''

[[tasks.rubric.forbidden]]
label = "rolls back outside Piceli"
pattern = 'kubectl rollout undo|helm rollback'

