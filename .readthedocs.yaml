# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
# Published as a subproject of the Pynenc docs: https://docs.pynenc.org/projects/piceli/en/stable/
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --all-extras --group docs

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true
