# Every command an adoption note gives for this lifecycle, as the acceptance
# runs it (tests/acceptance_k3s/lifecycle.py). The note copies these blocks:
# `python tests/acceptance_k3s/lifecycle.py --print-commands` prints them with
# the note's placeholders below instead of the disposable cluster's values.
#
# Fields: `run` (one command line, split like a shell would; no pipes),
# `exit` (accepted exit codes), `capture` (JSON key of stdout -> variable),
# `when` (run only when that variable is set), `stdin` (a secret variable fed
# on stdin, never printed), `note` (false: harness plumbing, not in the note),
# `serve` (runs until Ctrl-C; the harness starts it in its own session and
# stops it; its output holds a launch token and is never printed).
# Commands run from a clone of the composition repository (infra.py there).

[note]
# Placeholder -> what the note prints instead.
piceli = "piceli"
kubectl = "kubectl"
kubeconfig = "~/my-cluster.yaml"
context = "default"
repo = "https://git.example.com/team/infra.git"
image = "ghcr.io/pynenc/piceli-controller@sha256:<controller digest>"
builder_image = "ghcr.io/pynenc/piceli-builder@sha256:<builder digest>"
platform = "linux/arm64"
plan_hash = "<plan hash>"
rc_hash = "<plan hash>"
main_hash = "<plan hash>"
sha = "<commit>"
retention_digest = "<plan digest>"
access_env = "main"
ui_server = "http://127.0.0.1:8790/"
ticket = "<ticket id>"
connect_port = "18081"
stop_env = "rc"
edge = "edge-b"
edge_attr = "edge_b"
edge_kubeconfig = "~/edge-b.yaml"
edge_context = "default"
edge_server = "https://100.64.0.11:6443"
infra_hash = "<plan hash>"
install_digest = "<install digest>"
register_digest = "<register digest>"
destroy_hash = "<destroy plan hash>"
otlp_header_file = "~/otlp-authorization.txt"

[groups]
# Once per machine and cluster; re-running it is idempotent.
bootstrap = [
  "login",
  "cluster-init-plan",
  "cluster-init-approve",
  "secrets-git",
  "gitops-enable-plan",
  "gitops-enable-approve",
]
# Upgrade: pin the new piceli and image digests (in infra.py), push, then
# `gitops enable` alone (from 0.14.5 its plan also updates the in-cluster UI,
# result key "ui": "included"; no separate cluster init).
upgrade = [
  "gitops-enable-plan",
  "gitops-enable-approve",
]
status = ["cluster-status", "registry-status", "gitops-status"]
promote = ["promote-rc", "gitops-status"]
approve-rc = ["approve-rc"]
# main's first install creates cluster RBAC (a ClusterRole), outside the
# pipeline's approval policy: approve that one plan.
approve-main = ["gitops-status", "approve-main"]
retention = [
  "registry-status",
  "retention-plan",
  "retention-approve",
  "registry-gc-dry-run",
  "registry-gc",
  "registry-status",
]
# The in-cluster UI: prints one URL (with its launch token) and forwards
# 127.0.0.1:8790 until Ctrl-C. Deployment history lists every environment's
# runs (from 0.14.6).
ui = ["access-ui"]
# A forward left behind (its piceli killed, its kubectl still holding the
# port): `access ui` names it as Piceli's own; `access stop --stale` stops it
# (from 0.14.6).
access-stale = ["access-ui", "access-stop-stale"]
# An environment's declared forwards from a laptop (lifecycle_access.py names
# main and rc with their namespaces): web on 127.0.0.1:18080 until Ctrl-C. A
# forward left behind (its piceli killed) is stopped by `access stop --stale`
# with the same TARGET (from 0.14.7).
access-env = ["access-env", "access-env-stop-stale"]
# A forward started from the UI: the workload's Access panel issues a ticket
# and a one-time pairing secret; `ui connect` reads the secret on stdin (it
# prompts without echo) and binds 127.0.0.1:18081 until Ctrl-C or the UI
# stops the session (from 0.14.7).
ui-connect = ["access-ui", "ui-connect"]
# Stop a named environment (no replicas, volumes kept, not planned on a push)
# and start it again; `Environment(stopped=True)` in infra.py declares the
# same, and wins over `env start` (from 0.14.7).
env-stop-start = ["env-stop", "gitops-status", "env-start"]
# An environment's forwards (declared ones on their ports, every other
# Service on a free one) and the in-cluster UI, in one command until Ctrl-C;
# every kubectl stops with it, also when piceli is killed (from 0.14.7).
access-env-ui = ["access-env-ui"]
# Add a cluster the controller deploys to (from 0.15): a profile on this
# machine, its registry and node labels (`cluster init`, plan then
# approve), its credentials for the controller (a Secret on the controller's
# cluster; `--server` is the API address the controller uses). Then add it
# to an environment's `clusters=[...]` in infra.py, run the `upgrade` group
# (`gitops enable`: the controller may read the new Secret) and push.
edge-add = [
  "edge-login",
  "edge-cluster-init-plan",
  "edge-cluster-init-approve",
  "edge-secrets",
]
# Machines in typed Python, provisioned with OpenTofu (from 0.15.0;
# machines.py holds the Infrastructure). Once per state: a passphrase that
# encrypts the OpenTofu state (back the file up), and the provider token
# (`secrets provider NAME --prompt`; the acceptance's fake provider needs none).
# Then plan, approve, install the OS with the declared hook, register the
# server's k3s as its Cluster. Re-running is idempotent (plans: unchanged).
infra = [
  "infra-state-key",
  "infra-plan",
  "infra-apply",
  "infra-install-plan",
  "infra-install-approve",
  "infra-register-plan",
  "infra-register-approve",
  "infra-cluster-status",
  "infra-status",
]
# Destroy what Piceli created (never anything else), with its own approval.
infra-destroy = ["infra-destroy-plan", "infra-destroy-approve", "infra-status"]
# The controller's OpenTelemetry (from 0.16): put the collector's auth header
# in a Secret (the file holds e.g. `Bearer <token>`; never on the command
# line), declare `Controller(telemetry=Otlp("https://collector:4317",
# headers_secret="otlp-auth"))` in infra.py, push, then `gitops enable`.
telemetry = ["otel-headers-secret", "gitops-enable-plan", "gitops-enable-approve"]

[steps.otel-headers-secret]
# The Secret's key is the header name; its value is never printed.
run = """{kubectl} --kubeconfig {kubeconfig} --context {context} -n piceli-system \
  create secret generic otlp-auth --from-file=authorization={otlp_header_file}"""
exit = [0]

[steps.login]
run = "{piceli} login lifecycle --kubeconfig {kubeconfig} --context {context}"
exit = [0]

[steps.cluster-init-plan]
run = "{piceli} cluster init infra.py:cluster"
exit = [0, 3]          # 0: unchanged
capture = { plan_hash = "plan_hash" }
reset = ["plan_hash"]

[steps.cluster-init-approve]
run = "{piceli} cluster init infra.py:cluster --approve {plan_hash}"
exit = [0]
when = "plan_hash"

[steps.secrets-git]
run = "{piceli} secrets git --cluster infra.py:cluster --prompt"
exit = [0]
stdin = "git_token"

[steps.gitops-enable-plan]
run = """{piceli} gitops enable infra.py --repo {repo} --image {image} \
  --builder-image {builder_image} --credentials-secret piceli-build-git \
  --platform {platform} --storage-class lifecycle-retain --cluster-rbac"""
exit = [0, 3]
capture = { plan_hash = "plan_hash" }
reset = ["plan_hash"]

[steps.gitops-enable-approve]
run = """{piceli} gitops enable infra.py --repo {repo} --image {image} \
  --builder-image {builder_image} --credentials-secret piceli-build-git \
  --platform {platform} --storage-class lifecycle-retain --cluster-rbac \
  --approve {plan_hash}"""
exit = [0]
when = "plan_hash"

[steps.cluster-status]
run = "{piceli} cluster status infra.py:cluster --json"
exit = [0]

[steps.gitops-status]
run = "{piceli} gitops status --kubeconfig {kubeconfig} --context {context} --json"
exit = [0]

[steps.promote-rc]
run = "{piceli} promote rc main@{sha} --kubeconfig {kubeconfig} --context {context}"
exit = [0]

[steps.approve-main]
run = "{piceli} gitops approve main {main_hash} --kubeconfig {kubeconfig} --context {context}"
exit = [0]

[steps.approve-rc]
run = "{piceli} gitops approve rc {rc_hash} --kubeconfig {kubeconfig} --context {context}"
exit = [0]

[steps.registry-status]
# From 0.14.5 it accepts the composition's Cluster; storage.used_source is
# "du" or "volume-stats" (the claim), never the node filesystem.
run = "{piceli} registry status infra.py:cluster --json"
exit = [0]

[steps.retention-plan]
# Plan (exit 3): the JSON lists every deletion with why and bytes, and the
# approve_command. Reads the cluster's live inventory itself.
run = "{piceli} artifacts retention --cluster infra.py:cluster --delete"
exit = [3]
capture = { retention_digest = "digest" }

[steps.retention-approve]
run = "{piceli} artifacts retention --cluster infra.py:cluster --delete --approve {retention_digest}"
exit = [0]
when = "retention_digest"

[steps.registry-gc-dry-run]
run = """{kubectl} --kubeconfig {kubeconfig} --context {context} -n piceli-system \
  exec deploy/piceli-registry -- registry garbage-collect --dry-run /etc/distribution/config.yml"""
exit = [0]

[steps.registry-gc]
run = """{kubectl} --kubeconfig {kubeconfig} --context {context} -n piceli-system \
  exec deploy/piceli-registry -- registry garbage-collect /etc/distribution/config.yml"""
exit = [0]

[steps.access-ui]
run = "{piceli} access ui --cluster infra.py:cluster"
exit = [0]
serve = true

[steps.access-stop-stale]
# Exit 0, `stopped` lists the port with holder "piceli-forward"; the
# refusal of a second `access ui` hints at this command.
run = "{piceli} access stop --stale --cluster infra.py:cluster"
exit = [0]

[steps.access-env]
# JSON lines: started, status (each forward's state), stopped on Ctrl-C.
run = "{piceli} access lifecycle_access.py:{access_env} --json"
exit = [0]
serve = true

[steps.access-env-stop-stale]
# Exit 0; `stopped` lists the port with holder "piceli-forward" when a
# forward was left behind, and nothing otherwise.
run = "{piceli} access stop --stale lifecycle_access.py:{access_env}"
exit = [0]

[steps.ui-connect]
run = """{piceli} ui connect --server {ui_server} --ticket {ticket} \
  --kubeconfig {kubeconfig} --context {context} --local-port {connect_port}"""
exit = [0]
serve = true
stdin = "pairing_secret"

[steps.env-stop]
# Records a stop request; the controller scales the environment to zero on
# its next poll (gitops status: state stopped, reason requested).
run = "{piceli} env stop {stop_env} --cluster infra.py:cluster"
exit = [0]

[steps.env-start]
# Scales it back; a revision that moved while it was stopped deploys (with
# the environment's usual approval).
run = "{piceli} env start {stop_env} --cluster infra.py:cluster"
exit = [0]

[steps.access-env-ui]
# JSON lines: started (forwards, and "ui": the launch URL with its token),
# status, stopped on Ctrl-C.
run = "{piceli} access {access_env} --cluster infra.py:cluster --ui --json"
exit = [0]
serve = true

[steps.edge-login]
run = "{piceli} login {edge} --kubeconfig {edge_kubeconfig} --context {edge_context}"
exit = [0]

[steps.edge-cluster-init-plan]
run = "{piceli} cluster init infra.py:{edge_attr}"
exit = [0, 3]          # 0: unchanged
capture = { plan_hash = "plan_hash" }
reset = ["plan_hash"]

[steps.edge-cluster-init-approve]
run = "{piceli} cluster init infra.py:{edge_attr} --approve {plan_hash}"
exit = [0]
when = "plan_hash"

[steps.edge-secrets]
# Prints the Secret's name and key, never the credentials.
run = """{piceli} secrets cluster --cluster infra.py:{edge_attr} \
  --kubeconfig {edge_kubeconfig} --context {edge_context} --server {edge_server}"""
exit = [0]
[steps.infra-state-key]
# Exit 2 (infra-credential-exists) when the key is already stored: keep it.
run = "{piceli} secrets state-key machines-state --generate"
exit = [0, 2]

[steps.infra-plan]
# Exit 3 with the plan (changes, monthly estimate, plan_hash); 0: unchanged.
run = "{piceli} infra plan machines.py:infra"
exit = [0, 3]
capture = { infra_hash = "plan_hash" }
reset = ["infra_hash"]

[steps.infra-apply]
run = "{piceli} infra apply machines.py:infra --approve {infra_hash}"
exit = [0]
when = "infra_hash"

[steps.infra-status]
run = "{piceli} infra status machines.py:infra --json"
exit = [0]

[steps.infra-install-plan]
# Exit 3 with the rendered install command and its digest.
run = "{piceli} infra install machines.py:infra edge-1"
exit = [3]
capture = { install_digest = "digest" }
reset = ["install_digest"]

[steps.infra-install-approve]
run = "{piceli} infra install machines.py:infra edge-1 --approve {install_digest}"
exit = [0]
when = "install_digest"

[steps.infra-register-plan]
# Without --kubeconfig it reads k3s's over SSH and shows the host keys to pin.
run = """{piceli} infra register machines.py:infra edge-1 \
  --kubeconfig {kubeconfig} --context {context}"""
exit = [3]
capture = { register_digest = "digest" }
reset = ["register_digest"]

[steps.infra-register-approve]
run = """{piceli} infra register machines.py:infra edge-1 \
  --kubeconfig {kubeconfig} --context {context} --approve {register_digest}"""
exit = [0]
when = "register_digest"

[steps.infra-cluster-status]
# The registered cluster through its new profile (Cluster(credentials=)).
run = "{piceli} cluster status machines.py:edge --json"
exit = [0]

[steps.infra-destroy-plan]
run = "{piceli} infra destroy machines.py:infra"
exit = [0, 3]
capture = { destroy_hash = "plan_hash" }
reset = ["destroy_hash"]

[steps.infra-destroy-approve]
run = "{piceli} infra destroy machines.py:infra --approve {destroy_hash}"
exit = [0]
when = "destroy_hash"
